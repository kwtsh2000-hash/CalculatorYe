<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#C9A961" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Y♥E Calc" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Y♥E Calculator — حاسبة شاملة تعمل أوفلاين" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" type="image/png" href="icon.png" />
<title>Y♥E Calculator</title>
<style>
:root{
  --bg:#F5F7FA;
  --surface:rgba(255,255,255,0.85);
  --surface2:rgba(245,240,232,0.75);
  --primary:#C9A961;
  --primary-soft:rgba(245,232,200,0.85);
  --primary-deep:#A88A3F;
  --secondary:#5BA88F;
  --accent:#E8A5B0;
  --text:#2D2417;
  --muted:#7A6E5C;
  --danger:#D9534F;
  --border:rgba(220,205,180,0.55);
  --overlay:rgba(245,247,250,0.5);
  --header-bg:rgba(255,252,245,0.78);
  --nav-bg:rgba(255,252,245,0.85);
  --num-bg:rgba(255,255,255,0.9);
  --num-shadow:0 2px 8px rgba(201,169,97,.12), 0 1px 2px rgba(201,169,97,.06);
  --eq-shadow:0 6px 20px rgba(201,169,97,.5);
  --trig-bg:rgba(232,240,250,0.9);
  --trig-color:#4A7BC8;
  --hyper-bg:rgba(255,236,240,0.9);
  --hyper-color:#C9567A;
  --log-bg:rgba(232,250,244,0.9);
  --log-color:#3A8E75;
  --power-bg:rgba(255,244,230,0.9);
  --power-color:#D68A3B;
}
body.dark{
  --bg:#0F1117;
  --surface:rgba(28,24,18,0.82);
  --surface2:rgba(38,32,24,0.78);
  --primary:#E8C77F;
  --primary-soft:rgba(60,48,30,0.85);
  --primary-deep:#C9A961;
  --secondary:#7DBFA6;
  --accent:#FFB0BC;
  --text:#F5EDE0;
  --muted:#A89A82;
  --danger:#FF6B6B;
  --border:rgba(60,50,35,0.6);
  --overlay:rgba(15,13,10,0.72);
  --header-bg:rgba(28,24,18,0.82);
  --nav-bg:rgba(28,24,18,0.9);
  --num-bg:rgba(45,38,28,0.85);
  --num-shadow:0 2px 6px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.25);
  --eq-shadow:0 6px 20px rgba(232,199,127,.5);
  --trig-bg:rgba(45,55,80,0.85);
  --trig-color:#8DA9E8;
  --hyper-bg:rgba(70,42,55,0.85);
  --hyper-color:#FF96B0;
  --log-bg:rgba(35,62,52,0.85);
  --log-color:#5FD2A8;
  --power-bg:rgba(62,48,30,0.85);
  --power-color:#FFB566;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--text);overflow:hidden;transition:color .3s;overscroll-behavior:none;background:#1a1440}
body::before{content:"";position:fixed;inset:0;background-image:url('background.jpg');background-size:cover;background-position:center center;background-repeat:no-repeat;z-index:-2;transition:filter .4s ease}
body::after{content:"";position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:-1;transition:background .4s ease}
.hidden{display:none!important}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#F5E6D3 0%,#F5D5B8 50%,#E8D5C0 100%);animation:splashOut .8s cubic-bezier(.6,0,.4,1) 2.4s forwards;overflow:hidden}
.splash-bg{position:absolute;inset:0;background-image:url('splash.jpg');background-size:cover;background-position:center;opacity:.35;z-index:0;filter:blur(2px)}
.splash-glow-1{position:absolute;top:-30%;left:-30%;width:160%;height:160%;background:radial-gradient(circle at 30% 30%, rgba(201,169,97,.4) 0%, transparent 50%);animation:float1 8s ease-in-out infinite;z-index:1}
.splash-glow-2{position:absolute;bottom:-30%;right:-30%;width:160%;height:160%;background:radial-gradient(circle at 70% 70%, rgba(232,165,176,.35) 0%, transparent 50%);animation:float2 10s ease-in-out infinite;z-index:1}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,5%) scale(1.08)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,-5%) scale(1.1)}}
.splash-particles{position:absolute;inset:0;overflow:hidden;z-index:1}
.splash-particles span{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(201,169,97,.7);animation:rise linear infinite;box-shadow:0 0 12px rgba(201,169,97,.7)}
.splash-particles span:nth-child(1){left:10%;bottom:-10px;animation-duration:7s;animation-delay:0s}
.splash-particles span:nth-child(2){left:25%;bottom:-10px;animation-duration:9s;animation-delay:1s;background:rgba(232,165,176,.7)}
.splash-particles span:nth-child(3){left:42%;bottom:-10px;animation-duration:6s;animation-delay:2s}
.splash-particles span:nth-child(4){left:58%;bottom:-10px;animation-duration:8s;animation-delay:.5s;background:rgba(232,165,176,.7)}
.splash-particles span:nth-child(5){left:73%;bottom:-10px;animation-duration:7.5s;animation-delay:1.5s}
.splash-particles span:nth-child(6){left:88%;bottom:-10px;animation-duration:10s;animation-delay:2.5s;background:rgba(232,165,176,.7)}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.9}to{transform:translateY(-100vh);opacity:0}}
.splash-content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.splash-icon-wrap{position:relative;width:170px;height:170px;margin-bottom:32px;animation:iconAppear 1s cubic-bezier(.34,1.56,.64,1)}
.splash-icon-img{width:100%;height:100%;border-radius:42px;box-shadow:0 24px 60px rgba(201,169,97,.45),0 12px 30px rgba(232,165,176,.35);display:block;animation:iconRotate 6s ease-in-out infinite}
.splash-icon-glow{position:absolute;inset:-25px;border-radius:60px;background:radial-gradient(circle, rgba(201,169,97,.5) 0%, transparent 70%);animation:glowPulse 3s ease-in-out infinite;z-index:-1}
@keyframes iconAppear{0%{transform:scale(.3) rotate(-15deg);opacity:0}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes iconRotate{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.splash-title{font-size:34px;font-weight:900;color:#8B6F3F;letter-spacing:3px;text-shadow:0 2px 8px rgba(255,255,255,.6), 0 4px 20px rgba(201,169,97,.4);opacity:0;animation:fadeUp .7s ease .6s forwards;margin-bottom:8px;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.splash-subtitle{font-size:12px;color:#A88A5F;letter-spacing:8px;text-transform:uppercase;font-weight:700;opacity:0;animation:fadeUp .7s ease .9s forwards;text-shadow:0 1px 4px rgba(255,255,255,.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.splash-loader{position:absolute;bottom:80px;width:120px;height:3px;background:rgba(201,169,97,.25);border-radius:3px;overflow:hidden;opacity:0;animation:fade 0.5s ease 1.2s forwards;z-index:3}
.splash-loader::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg, transparent, #C9A961, transparent);border-radius:3px;animation:loadSlide 1.6s ease-in-out infinite}
@keyframes loadSlide{0%{left:-40%}100%{left:100%}}
@keyframes fade{to{opacity:1}}
.splash-footer{position:absolute;bottom:32px;font-size:11px;color:#A88A5F;letter-spacing:2px;font-weight:600;opacity:0;animation:fade 0.6s ease 1.5s forwards;z-index:3}
.splash-footer b{color:#C9A961}
@keyframes splashOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08);visibility:hidden}}

/* APP */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(8px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:20px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:3px;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.brand .y{color:#C9A961}
.brand .h{color:#E8A5B0}
.brand .e{color:#5BA88F}
.badges{display:flex;gap:6px;align-items:center}
.badge{font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary-deep);padding:5px 10px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .1s}
.badge:active{transform:scale(.94)}
.badge.on{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff}
.screen-container{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px 12px 6px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* DISPLAY */
.display{background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:16px 18px;margin-bottom:12px;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 28px rgba(201,169,97,.15), inset 0 1px 0 rgba(255,255,255,.5);flex-shrink:0;position:relative;overflow:hidden}
.display::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,97,.5),transparent)}
.expression{color:var(--muted);font-size:14px;overflow-x:auto;white-space:nowrap;direction:ltr;text-align:right;min-height:18px;scrollbar-width:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.3px}
.expression::-webkit-scrollbar,.result::-webkit-scrollbar{display:none}
.result{font-size:34px;font-weight:800;direction:ltr;text-align:right;overflow-x:auto;white-space:nowrap;margin-top:6px;scrollbar-width:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:-.5px;color:var(--text)}
.result.error{color:var(--danger);font-size:15px;font-weight:600;letter-spacing:0}

/* BUTTONS */
.pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr;padding:4px 2px}
.btn{position:relative;border:none;border-radius:50px;background:var(--num-bg);color:var(--text);font-size:22px;font-weight:700;cursor:pointer;transition:transform .08s ease, box-shadow .15s ease, background .15s ease, color .15s ease;user-select:none;min-height:54px;font-family:inherit;touch-action:manipulation;direction:ltr;box-shadow:var(--num-shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.93);box-shadow:0 1px 3px rgba(0,0,0,.08);background:var(--surface2)}
.btn.op{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-deep));box-shadow:0 4px 14px rgba(201,169,97,.4);font-size:24px;font-weight:700}
.btn.op:active{background:linear-gradient(135deg,var(--primary-deep),var(--primary));box-shadow:0 2px 6px rgba(201,169,97,.5)}
.btn.fn{color:var(--primary-deep);background:var(--primary-soft);font-size:16px;font-weight:700;box-shadow:0 2px 6px rgba(201,169,97,.2)}
.btn.fn:active{background:rgba(201,169,97,.3)}
.btn.eq{background:linear-gradient(135deg,var(--primary),#E8C77F);color:#4A3618;font-size:26px;font-weight:800;box-shadow:var(--eq-shadow);grid-column:span 2;border-radius:50px}
.btn.eq:active{background:linear-gradient(135deg,var(--primary-deep),#C9A961);box-shadow:0 3px 10px rgba(201,169,97,.6)}
.btn.ac{color:var(--danger);background:rgba(217,83,79,.12);font-weight:800}
.btn.ac:active{background:rgba(217,83,79,.2)}

/* SCIENTIFIC */
.sci-wrap{display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden}
.sci-tabs{display:flex;gap:6px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:16px;padding:4px;flex-shrink:0;box-shadow:0 2px 10px rgba(201,169,97,.1)}
.sci-tab{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px}
.sci-tab .tab-ic{font-size:16px;line-height:1}
.sci-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 3px 10px rgba(201,169,97,.5)}
.sci-tab:active{transform:scale(.96)}
.sci-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 16px rgba(201,169,97,.1);flex-shrink:0;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sci-btn{position:relative;padding:12px 4px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .08s, background .15s;min-height:52px;display:flex;align-items:center;justify-content:center;direction:ltr;color:var(--text);background:var(--surface2);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sci-btn:active{transform:scale(.92);background:var(--surface)}
.sci-btn.trig{background:var(--trig-bg);color:var(--trig-color);border-color:transparent}
.sci-btn.hyper{background:var(--hyper-bg);color:var(--hyper-color);border-color:transparent}
.sci-btn.log{background:var(--log-bg);color:var(--log-color);border-color:transparent}
.sci-btn.power{background:var(--power-bg);color:var(--power-color);border-color:transparent}
.sci-btn.special{background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(201,169,97,.4)}
.sci-btn.special:active{background:linear-gradient(135deg,var(--primary-deep),var(--primary))}
.sci-btn.ac-btn{background:rgba(217,83,79,.15);color:var(--danger);border-color:rgba(217,83,79,.3);font-weight:800}
.sci-btn.back-btn{background:rgba(255,193,7,.15);color:#D68A3B;border-color:rgba(255,193,7,.3)}

/* SCI NUMS مع زر = */
.sci-nums{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr;padding:2px;min-height:0}
.sci-nums .btn{min-height:0;height:100%;font-size:20px;font-weight:700;border-radius:18px}
.sci-nums .btn.op{font-size:22px}
.sci-nums .btn.eq{grid-column:span 1;font-size:24px}
.sci-nums .btn.fn{font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 3px 10px rgba(201,169,97,.4)}

/* TOOLS */
.section-title{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:6px;text-shadow:0 1px 3px rgba(255,255,255,.3)}
body.dark .section-title{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.tools-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.tool-card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(201,169,97,.1)}
.tool-card h3{font-size:13px;color:var(--primary-deep);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tool-card h3 span{color:var(--muted);font-weight:400;font-size:11px;font-family:monospace}
.tool-card .row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.tool-card input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;min-width:0;font-family:inherit;transition:border .2s}
.tool-card input:focus{outline:none;border-color:var(--primary)}
.tool-card .actions{display:flex;gap:8px;margin-top:10px}
.tool-card button{flex:1;padding:10px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit;transition:transform .08s;box-shadow:0 3px 10px rgba(201,169,97,.4)}
.tool-card button:active{transform:scale(.97)}
.tool-card button.reset{background:var(--surface2);color:var(--text);box-shadow:none;border:1px solid var(--border)}
.tool-result{margin-top:10px;padding:10px;border-radius:12px;background:var(--primary-soft);color:var(--primary-deep);font-weight:700;text-align:center;font-size:14px;direction:ltr;font-family:monospace;display:none}

/* CONVERTER */
.conv-form{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.conv-form label{font-size:12px;color:var(--text);margin-top:6px;font-weight:700;padding-right:4px;text-shadow:0 1px 3px rgba(255,255,255,.3)}
body.dark .conv-form label{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.conv-form select,.conv-form input{padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border .2s;width:100%}
.conv-form select:focus,.conv-form input:focus{outline:none;border-color:var(--primary)}
.conv-result{margin-top:12px;padding:18px;border-radius:18px;background:var(--primary-soft);color:var(--primary-deep);font-size:22px;font-weight:800;text-align:center;direction:ltr;font-family:monospace;word-break:break-all;border:1px solid var(--border);box-shadow:0 4px 16px rgba(201,169,97,.2)}

/* HISTORY */
.hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn-clear-hist{background:rgba(217,83,79,.12);border:1px solid var(--danger);color:var(--danger);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;transition:transform .1s}
.btn-clear-hist:active{transform:scale(.95)}
.history-list{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.history-item{background:var(--surface);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .1s, background .15s;box-shadow:0 2px 10px rgba(201,169,97,.08);position:relative}
.history-item:active{transform:scale(.98);background:var(--surface2)}
.history-item .hi-expr{color:var(--muted);font-size:12px;direction:ltr;text-align:right;font-family:monospace}
.history-item .hi-res{color:var(--text);font-size:17px;font-weight:800;direction:ltr;text-align:right;margin-top:3px;font-family:monospace}
.history-item .del{position:absolute;left:8px;top:8px;background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 8px;border-radius:50%;transition:background .15s}
.history-item .del:active{background:rgba(217,83,79,.15);color:var(--danger)}
.empty-msg{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;background:var(--surface);backdrop-filter:blur(12px);border-radius:18px;border:1px solid var(--border);font-weight:600}

/* SETTINGS */
.settings-group{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:4px 0;margin-bottom:12px;box-shadow:0 4px 16px rgba(201,169,97,.1);overflow:hidden}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.setting-row:last-child{border-bottom:none}
.setting-row select{padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:13px;font-weight:600}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--surface2);border-radius:26px;transition:.25s;cursor:pointer;border:1px solid var(--border)}
.slider:before{content:"";position:absolute;height:20px;width:20px;right:3px;top:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:linear-gradient(135deg,var(--primary),var(--primary-deep));border-color:transparent}
.switch input:checked+.slider:before{transform:translateX(-20px)}
.about{text-align:center;padding:20px 0;background:var(--surface);backdrop-filter:blur(12px);border-radius:18px;border:1px solid var(--border);margin-top:12px;box-shadow:0 4px 16px rgba(201,169,97,.1)}

<script>
/* ============================================================
   ENGINE — محسّن
   ============================================================ */
const Engine = (() => {
  class MathError extends Error {
    constructor(code, msg){ super(msg); this.code = code; }
  }
  const FN = {
    sin:(x,d)=>Math.sin(d?x*Math.PI/180:x),
    cos:(x,d)=>Math.cos(d?x*Math.PI/180:x),
    tan:(x,d)=>{const r=d?x*Math.PI/180:x;if(Math.abs(Math.cos(r))<1e-12)throw new MathError('DOMAIN','tan غير معرف');return Math.tan(r);},
    asin:(x,d)=>{if(x<-1||x>1)throw new MathError('DOMAIN','asin: [-1,1]');const r=Math.asin(x);return d?r*180/Math.PI:r;},
    acos:(x,d)=>{if(x<-1||x>1)throw new MathError('DOMAIN','acos: [-1,1]');const r=Math.acos(x);return d?r*180/Math.PI:r;},
    atan:(x,d)=>{const r=Math.atan(x);return d?r*180/Math.PI:r;},
    sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,
    ln:(x)=>{if(x<=0)throw new MathError('DOMAIN','ln يحتاج رقم موجب');return Math.log(x);},
    log:(x)=>{if(x<=0)throw new MathError('DOMAIN','log يحتاج رقم موجب');return Math.log10(x);},
    sqrt:(x)=>{if(x<0)throw new MathError('DOMAIN','جذر لعدد سالب');return Math.sqrt(x);},
    abs:Math.abs,exp:Math.exp
  };
  function tokenize(src){
    const s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
    const t=[];let i=0;
    while(i<s.length){
      const c=s[i];
      if(c===' '){i++;continue;}
      if(/[0-9.]/.test(c)){
        let n='',dots=0;
        while(i<s.length&&/[0-9.]/.test(s[i])){
          if(s[i]==='.'){dots++;if(dots>1)throw new MathError('SYNTAX','رقم غير صالح');}
          n+=s[i++];
        }
        if(i<s.length&&(s[i]==='E'||s[i]==='e')&&(s[i+1]==='+'||s[i+1]==='-'||/[0-9]/.test(s[i+1]||''))){
          n+='e';i++;
          if(s[i]==='+'||s[i]==='-')n+=s[i++];
          while(i<s.length&&/[0-9]/.test(s[i]))n+=s[i++];
        }
        if(n==='.')throw new MathError('SYNTAX','نقطة بدون رقم');
        t.push({t:'num',v:parseFloat(n)});
        continue;
      }
      if(c==='π'){t.push({t:'num',v:Math.PI});i++;continue;}
      if(c==='e'&&(i===0||!/[0-9]/.test(s[i-1]))){t.push({t:'num',v:Math.E});i++;continue;}
      if('+-*/^%'.includes(c)){t.push({t:'op',v:c});i++;continue;}
      if(c==='('){t.push({t:'lp'});i++;continue;}
      if(c===')'){t.push({t:'rp'});i++;continue;}
      if(c==='!'){t.push({t:'bang'});i++;continue;}
      const fns=['asin','acos','atan','sinh','cosh','tanh','sin','cos','tan','log','ln','abs','sqrt','exp'];
      let hit=false;
      for(const f of fns){if(s.startsWith(f,i)){t.push({t:'fn',v:f});i+=f.length;hit=true;break;}}
      if(hit)continue;
      if(c==='√'){t.push({t:'fn',v:'sqrt'});i++;continue;}
      throw new MathError('SYNTAX','رمز غير معروف: '+c);
    }
    return t;
  }
  function evaluate(tokens,angleDeg){
    let p=0;
    const peek=()=>tokens[p];
    const next=()=>tokens[p++];
    const eat=(type)=>{const x=next();if(!x||x.t!==type)throw new MathError('SYNTAX','تعبير غير صالح');return x;};
    function factor(){
      const tok=peek();
      if(!tok)throw new MathError('SYNTAX','تعبير ناقص');
      if(tok.t==='op'&&(tok.v==='-'||tok.v==='+')){next();const v=factor();return tok.v==='-'?-v:v;}
      if(tok.t==='num'){next();return tok.v;}
      if(tok.t==='lp'){next();const v=expr();eat('rp');return v;}
      if(tok.t==='fn'){
        next();let arg;
        if(peek()&&peek().t==='lp'){next();arg=expr();eat('rp');}
        else{arg=factor();}
        const f=FN[tok.v];
        if(!f)throw new MathError('SYNTAX','دالة غير معروفة: '+tok.v);
        return f(arg,angleDeg);
      }
      throw new MathError('SYNTAX','تعبير غير صالح');
    }
    function postfix(){
      let v=factor();
      while(peek()&&peek().t==='bang'){
        next();
        if(v<0||!Number.isInteger(v))throw new MathError('DOMAIN','! يحتاج عدد صحيح موجب');
        if(v>170)throw new MathError('OVERFLOW','الرقم كبير جدًا');
        let r=1;for(let k=2;k<=v;k++)r*=k;
        v=r;
      }
      return v;
    }
    function power(){
      const base=postfix();
      if(peek()&&peek().t==='op'&&peek().v==='^'){
        next();const e=power();
        const r=Math.pow(base,e);
        if(!isFinite(r))throw new MathError('OVERFLOW','الرقم كبير جدًا');
        return r;
      }
      return base;
    }
    function term(){
      let v=power();
      while(peek()&&peek().t==='op'&&'*/%'.includes(peek().v)){
        const op=next().v;const r=power();
        if(op==='*')v*=r;
        else if(op==='/'){
          if(r===0)throw new MathError('DIV0','لا يمكن القسمة على صفر');
          v/=r;
        }else{
          if(r===0)throw new MathError('DIV0','لا يمكن القسمة على صفر');
          v=v%r;
        }
      }
      return v;
    }
    function expr(){
      let v=term();
      while(peek()&&peek().t==='op'&&'+-'.includes(peek().v)){
        const op=next().v;const r=term();
        v=op==='+'?v+r:v-r;
      }
      return v;
    }
    const out=expr();
    if(p<tokens.length)throw new MathError('SYNTAX','رموز زائدة');
    if(!isFinite(out))throw new MathError('OVERFLOW','الرقم كبير جدًا');
    return out;
  }
  function calculate(expression,angleDeg,precision){
    if(!expression||!expression.trim())throw new MathError('EMPTY','أدخل عملية');
    let open=0;
    for(const ch of expression){
      if(ch==='(')open++;
      else if(ch===')'){open--;if(open<0)throw new MathError('SYNTAX','أقواس غير متوازنة');}
    }
    if(open!==0)throw new MathError('SYNTAX','أقواس غير مغلقة');
    const tokens=tokenize(expression);
    const value=evaluate(tokens,angleDeg);
    return roundTo(value,precision||10);
  }
  function roundTo(v,prec){
    if(!isFinite(v))return v;
    const p = Math.max(prec||10, 12);
    return parseFloat(v.toPrecision(p));
  }
  function format(value,prec){
    if(!isFinite(value))return 'Error';
    const rounded=roundTo(value,prec||10);
    const abs=Math.abs(rounded);
    if(abs!==0&&(abs>=1e15||abs<1e-9)){
      return rounded.toExponential(Math.min(prec||10,8)).replace(/\.?0+e/,'e');
    }
    let str=rounded.toString();
    const [int,dec]=str.split('.');
    const sign=int.startsWith('-')?'-':'';
    const intAbs=sign?int.slice(1):int;
    const withCommas=intAbs.replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return sign+withCommas+(dec?'.'+dec:'');
  }
  return {calculate,format,MathError};
})();

(() => {
  'use strict';
  const state = {
    expr:'', result:'0', lastAns:0,
    angleDeg:true, theme:'light', soundOn:true, historyOn:true,
    precision:10, history:[], afterEquals:false
  };
  const KEY='ye_calc_v1';
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({angleDeg:state.angleDeg,theme:state.theme,soundOn:state.soundOn,historyOn:state.historyOn,precision:state.precision,history:state.history.slice(0,80),lastAns:state.lastAns}));}catch(e){}};
  const load=()=>{try{const raw=localStorage.getItem(KEY);if(!raw)return;const d=JSON.parse(raw);Object.assign(state,{angleDeg:d.angleDeg??true,theme:d.theme??'light',soundOn:d.soundOn??true,historyOn:d.historyOn??true,precision:d.precision??10,history:d.history??[],lastAns:d.lastAns??0});}catch(e){}};

  const $=s=>document.querySelector(s);
  const $$=s=>Array.from(document.querySelectorAll(s));

  let ac=null;
  function beep(){
    if(!state.soundOn)return;
    try{
      if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=720;
      g.gain.setValueAtTime(0.06,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.05);
      o.connect(g);g.connect(ac.destination);
      o.start();o.stop(ac.currentTime+0.05);
    }catch(e){}
  }

  let toastTimer=null;
  function toast(msg){
    const old=document.querySelector('.toast');if(old)old.remove();
    const t=document.createElement('div');
    t.className='toast';t.textContent=msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.remove(),2200);
  }

  function render(){
    const expr=state.expr||'';
    const isErr=typeof state.result==='string'&&state.result.startsWith('!');
    const resText=isErr?state.result.slice(1):state.result;
    $('#exprBasic').textContent=expr;
    $('#exprSci').textContent=expr;
    ['#resBasic','#resSci'].forEach(sel=>{
      const el=$(sel);
      el.textContent=resText;
      el.classList.toggle('error',isErr);
    });
    $('#angleBadge').textContent=state.angleDeg?'DEG':'RAD';
    $('#themeBadge').textContent=state.theme==='dark'?'☀':'🌙';
  }

  const OPS='+−×÷^%';
  function push(v){
    const last=state.expr.slice(-1);
    if(OPS.includes(v)&&OPS.includes(last)){state.expr=state.expr.slice(0,-1)+v;return;}
    if(v==='.'){
      const m=state.expr.match(/[0-9.]*$/);
      const seg=m?m[0]:'';
      if(seg.includes('.'))return;
      if(seg===''){state.expr+='0.';return;}
    }
    if(state.expr===''&&'+×÷^%'.includes(v))return;
    if(state.expr===''&&v==='−'){state.expr='−';return;}
    state.expr+=v;
  }

  function backspace(){
    if(!state.expr)return;
    const m=state.expr.match(/(asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|log|ln|abs|sqrt|exp)\($/);
    if(m)state.expr=state.expr.slice(0,-m[0].length);
    else state.expr=state.expr.slice(0,-1);
  }

  function clearAll(){state.expr='';state.result='0';state.afterEquals=false;}

  function handleAfterEquals(v){
    if(!state.afterEquals)return;
    if(OPS.includes(v)){
      state.expr=state.result.replace(/,/g,'')+v;
      state.afterEquals=false;
    }else if(/[0-9.(]/.test(v)){
      state.expr='';state.afterEquals=false;
    }
  }

  function equals(){
    if(!state.expr.trim()){
      if(state.lastAns!==0){state.result=Engine.format(state.lastAns,state.precision);render();}
      return;
    }
    try{
      const v=Engine.calculate(state.expr,state.angleDeg,state.precision);
      state.lastAns=v;
      state.result=Engine.format(v,state.precision);
      state.afterEquals=true;
      if(state.historyOn){
        state.history.unshift({e:state.expr,r:state.result,t:Date.now()});
        if(state.history.length>80)state.history.pop();
        renderHistory();
      }
      save();
    }catch(err){
      const msg=err instanceof Engine.MathError?err.message:'خطأ';
      toast(msg);
      state.result='!'+msg;
    }
    render();
  }

  function applySci(key){
    switch(key){
      case 'clear':clearAll();render();return;
      case 'back':backspace();render();return;
      case 'equals':equals();return;
      case 'pi':push('π');render();return;
      case 'econst':push('e');render();return;
      case 'sqrt':state.expr+='√(';render();return;
      case 'sqr':if(state.expr)state.expr='('+state.expr+')^2';render();return;
      case 'inv':if(state.expr)state.expr='1/('+state.expr+')';render();return;
      case 'exp':state.expr+='e^(';render();return;
      case 'fact':state.expr+='!';render();return;
      case 'abs':state.expr+='abs(';render();return;
      case 'pow':state.expr+='^';render();return;
      case 'E':state.expr+='E';render();return;
      case 'ans':state.expr+=state.lastAns.toString();render();return;
      case '(':state.expr+='(';render();return;
      case ')':state.expr+=')';render();return;
      case 'sin':case 'cos':case 'tan':
      case 'asin':case 'acos':case 'atan':
      case 'sinh':case 'cosh':case 'tanh':
      case 'ln':case 'log':
        state.expr+=key+'(';render();return;
      default:
        if(/^[0-9]$/.test(key)||key==='.'||OPS.includes(key)){
          handleAfterEquals(key);push(key);render();
        }
    }
  }

  function initConv(){
    const cat=$('#convCat'),from=$('#convFrom'),to=$('#convTo'),inp=$('#convIn'),out=$('#convOut');
    cat.innerHTML='';
    Object.entries(CATS).forEach(([k,v])=>{
      const o=document.createElement('option');o.value=k;o.textContent=v.n;cat.appendChild(o);
    });
    const fill=()=>{
      const c=CATS[cat.value];from.innerHTML='';to.innerHTML='';
      Object.keys(c.u).forEach(u=>{
        const a=document.createElement('option');a.value=u;a.textContent=u;
        const b=document.createElement('option');b.value=u;b.textContent=u;
        from.appendChild(a);to.appendChild(b);
      });
      if(to.options.length>1)to.selectedIndex=1;
      convert();
    };
    const convert=()=>{
      const c=CATS[cat.value];
      const v=parseFloat(inp.value);
      if(isNaN(v)){out.textContent='0';return;}
      const f=from.value,t=to.value;
      let r;
      if(c.special){r=convertTemp(v,f,t);}
      else{r=(v*c.u[f])/c.u[t];}
      out.textContent=formatNum(r)+' '+t;
    };
    const convertTemp=(v,f,t)=>{
      let c;
      if(f==='°C')c=v;
      else if(f==='°F')c=(v-32)*5/9;
      else c=v-273.15;
      if(t==='°C')return c;
      if(t==='°F')return c*9/5+32;
      return c+273.15;
    };
    const formatNum=n=>{
      if(!isFinite(n))return '∞';
      const a=Math.abs(n);
      if(a!==0&&(a>=1e15||a<1e-6))return n.toExponential(6);
      return parseFloat(n.toPrecision(10)).toString();
    };
    cat.addEventListener('change',fill);
    from.addEventListener('change',convert);
    to.addEventListener('change',convert);
    inp.addEventListener('input',convert);
    fill();
  }

      if(document.querySelector('.install-banner'))return;
      try{if(localStorage.getItem(DISMISS_KEY))return;}catch(e){}
      const b=document.createElement('div');
      b.className='install-banner';
      b.innerHTML=`<span>📲 ثبّت Y♥E Calculator</span><div style="display:flex;gap:6px"><button id="installBtn">تثبيت</button><button class="close" id="installClose">✕</button></div>`;
      document.body.appendChild(b);
      b.querySelector('#installBtn').addEventListener('click',async()=>{
        if(!deferredPrompt){dismissBanner();return;}
        deferredPrompt.prompt();
        try{const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted')dismissBanner();else b.remove();}catch(e){b.remove();}
        deferredPrompt=null;
      });
      b.querySelector('#installClose').addEventListener('click',dismissBanner);
    }
    window.addEventListener('beforeinstallprompt',(e)=>{
      e.preventDefault();
      deferredPrompt=e;
      showInstallBanner();
    });
    const settingsBtn=document.getElementById('settingsInstallBtn');
    if(settingsBtn){
      settingsBtn.addEventListener('click',async()=>{
        if(!deferredPrompt){alert('التطبيق مثبّت بالفعل، أو استخدم قائمة المتصفح → "تثبيت التطبيق"');return;}
        deferredPrompt.prompt();
        try{const{outcome}=await deferredPrompt.userChoice;if(outcome==='accepted'){dismissBanner();}}catch(e){}
        deferredPrompt=null;
      });
    }
    const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
    if(isIOS&&!isStandalone){
      setTimeout(()=>{
        if(document.querySelector('.install-banner'))return;
        try{if(localStorage.getItem(DISMISS_KEY))return;}catch(e){}
        const b=document.createElement('div');
        b.className='install-banner';
        b.innerHTML=`<span>📲 اضغط زر المشاركة <b>⬆</b> ثم "إضافة إلى الشاشة الرئيسية"</span><button class="close" id="installClose">✕</button>`;
        document.body.appendChild(b);
        b.querySelector('#installClose').addEventListener('click',dismissBanner);
      },4000);
    }
  });
})();
</script>
