<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#C9A961" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Y♥E Calc" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" type="image/png" href="icon.png" />
<title>Y♥E Calculator</title>
<style>
/* ============================================================
   THEMES: Flat Modern (نهار) + Dark Premium Gold (ليل)
   ============================================================ */
:root,[data-theme="light"]{
  --bg:#F8F9FB;
  --bg-solid:#EEF1F6;
  --surface:#FFFFFF;
  --surface2:#F2F4F8;
  --surface3:#E8ECF2;
  --primary:#6C5CE7;
  --primary-deep:#5B4BD6;
  --primary-soft:#EEF0FF;
  --accent:#C9A961;
  --secondary:#00B894;
  --danger:#E74C3C;
  --warning:#F39C12;
  --text:#1A202C;
  --text2:#2D3748;
  --muted:#718096;
  --muted2:#A0AEC0;
  --border:#E2E8F0;
  --border-strong:#CBD5E0;
  --num-bg:#FFFFFF;
  --num-text:#1A202C;
  --op-bg:#EEF0FF;
  --op-text:#5B4BD6;
  --fn-bg:#E6FFFA;
  --fn-text:#008B6F;
  --eq-bg:#6C5CE7;
  --eq-text:#FFFFFF;
  --ac-bg:#FFEBEE;
  --ac-text:#C62828;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.1);
}
[data-theme="dark"]{
  --bg:#0A0A0A;
  --bg-solid:#050505;
  --surface:#141414;
  --surface2:#1C1C1C;
  --surface3:#262626;
  --primary:#C9A961;
  --primary-deep:#B8965A;
  --primary-soft:#1F1A0F;
  --accent:#E8C77F;
  --secondary:#7DBFA6;
  --danger:#FF6B6B;
  --warning:#FFB566;
  --text:#F5F0E5;
  --text2:#E8DCC4;
  --muted:#8A8070;
  --muted2:#6B6355;
  --border:#2A2620;
  --border-strong:#3D362A;
  --num-bg:#1A1A1A;
  --num-text:#F5F0E5;
  --op-bg:#1F1A0F;
  --op-text:#E8C77F;
  --fn-bg:#0F1F1A;
  --fn-text:#7DBFA6;
  --eq-bg:linear-gradient(135deg,#C9A961,#E8C77F);
  --eq-text:#1A1410;
  --ac-bg:#2A1515;
  --ac-text:#FF6B6B;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:0 8px 24px rgba(201,169,97,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  font-family:-apple-system,"Segoe UI",Tahoma,system-ui,sans-serif;
  color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  transition:background-color .3s,color .3s;
}
body{background:var(--bg)}
body::before{
  content:"";position:fixed;inset:0;
  background-image:url('background.jpg');
  background-size:cover;background-position:center;
  z-index:-2;opacity:.15;
  transition:opacity .3s;
}
[data-theme="dark"] body::before{opacity:.25}
.hidden{display:none!important}

/* ============================================================
   SPLASH
   ============================================================ */
.splash{
  position:fixed;inset:0;z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#F5E6D3 0%,#E8D5C0 50%,#C9A961 100%);
  animation:splashOut .8s cubic-bezier(.6,0,.4,1) 2.4s forwards;
  overflow:hidden;
}
[data-theme="dark"] .splash{
  background:linear-gradient(135deg,#0A0A0A 0%,#1A1410 50%,#2A2015 100%);
}
.splash-glow-1{
  position:absolute;top:-30%;left:-30%;width:160%;height:160%;
  background:radial-gradient(circle at 30% 30%,rgba(201,169,97,.4) 0%,transparent 50%);
  animation:float1 8s ease-in-out infinite;
}
.splash-glow-2{
  position:absolute;bottom:-30%;right:-30%;width:160%;height:160%;
  background:radial-gradient(circle at 70% 70%,rgba(232,165,176,.35) 0%,transparent 50%);
  animation:float2 10s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,5%) scale(1.08)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8%,-5%) scale(1.1)}}
.splash-content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
.splash-icon-wrap{position:relative;width:150px;height:150px;margin-bottom:24px;animation:iconAppear 1s cubic-bezier(.34,1.56,.64,1)}
.splash-icon-img{width:100%;height:100%;border-radius:36px;box-shadow:0 20px 50px rgba(201,169,97,.5),0 10px 24px rgba(0,0,0,.2);display:block;animation:iconRotate 6s ease-in-out infinite}
.splash-icon-glow{position:absolute;inset:-20px;border-radius:50px;background:radial-gradient(circle,rgba(201,169,97,.5) 0%,transparent 70%);animation:glowPulse 3s ease-in-out infinite;z-index:-1}
@keyframes iconAppear{0%{transform:scale(.3) rotate(-15deg);opacity:0}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes iconRotate{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.splash-title{font-size:30px;font-weight:900;color:#8B6F3F;letter-spacing:3px;text-shadow:0 2px 8px rgba(255,255,255,.6);opacity:0;animation:fadeUp .7s ease .6s forwards;margin-bottom:6px}
[data-theme="dark"] .splash-title{color:#E8C77F;text-shadow:0 2px 12px rgba(201,169,97,.5)}
.splash-subtitle{font-size:11px;color:#A88A5F;letter-spacing:8px;font-weight:700;opacity:0;animation:fadeUp .7s ease .9s forwards}
[data-theme="dark"] .splash-subtitle{color:#C9A961}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08);visibility:hidden}}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:460px;margin:0 auto;background:var(--bg);position:relative}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(8px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:2px}
.brand .y{color:#C9A961}
.brand .h{color:#E8A5B0}
.brand .e{color:#5BA88F}
.badges{display:flex;gap:6px}
.badge{font-size:11px;font-weight:700;background:var(--primary-soft);color:var(--primary);padding:5px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--border);font-family:inherit}
.badge.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.badge:active{transform:scale(.94)}

.screen-container{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:10px;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}

/* ============================================================
   DISPLAY
   ============================================================ */
.display{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px 16px;
  margin-bottom:10px;
  min-height:100px;
  display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:var(--shadow);
  flex-shrink:0;
  position:relative;
  overflow:hidden;
}
.display::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);
  opacity:.5;
}
.expression{
  color:var(--muted);
  font-size:13px;
  overflow-x:auto;white-space:nowrap;
  direction:ltr;text-align:right;
  min-height:18px;
  scrollbar-width:none;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
}
.expression::-webkit-scrollbar,.result::-webkit-scrollbar{display:none}
.result{
  font-size:30px;
  font-weight:800;
  direction:ltr;text-align:right;
  overflow-x:auto;white-space:nowrap;
  margin-top:6px;
  scrollbar-width:none;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  color:var(--text);
  letter-spacing:-.5px;
}
.result.error{color:var(--danger);font-size:14px;font-weight:600}
.result-info{
  font-size:10px;
  color:var(--muted2);
  margin-top:3px;
  direction:ltr;
  text-align:right;
  font-family:ui-monospace,monospace;
  min-height:12px;
}

/* ============================================================
   BASIC PAD
   ============================================================ */
.pad{
  flex:1;display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;direction:ltr;
  min-height:0;
}
.btn{
  position:relative;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--num-bg);
  color:var(--num-text);
  font-size:20px;font-weight:700;
  cursor:pointer;
  transition:transform .08s,background .12s;
  user-select:none;
  min-height:48px;
  font-family:inherit;
  direction:ltr;
  box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
  padding:2px;
}
.btn:active{transform:scale(.94);background:var(--surface2)}
.btn.op{
  background:var(--op-bg);
  color:var(--op-text);
  border-color:transparent;
  font-size:22px;
}
.btn.op:active{background:var(--surface3)}
.btn.fn{
  background:var(--fn-bg);
  color:var(--fn-text);
  border-color:transparent;
  font-size:14px;font-weight:800;
}
.btn.fn:active{background:var(--surface3)}
.btn.eq{
  background:var(--eq-bg);
  color:var(--eq-text);
  border-color:transparent;
  font-size:24px;font-weight:800;
  grid-column:span 2;
  box-shadow:var(--shadow-md);
}
[data-theme="dark"] .btn.eq{background:var(--eq-bg)}
.btn.eq:active{transform:scale(.96);opacity:.9}
.btn.ac{
  background:var(--ac-bg);
  color:var(--ac-text);
  border-color:transparent;
  font-weight:800;
}

/* ============================================================
   SCIENTIFIC
   ============================================================ */
.sci-wrap{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.sci-tabs{
  display:flex;gap:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;padding:4px;
  flex-shrink:0;
  box-shadow:var(--shadow);
}
.sci-tab{
  flex:1;padding:6px 2px;
  border:none;background:transparent;
  color:var(--muted);
  font-size:9px;font-weight:700;
  border-radius:10px;
  cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  transition:all .2s;
}
.sci-tab .tab-ic{font-size:14px;line-height:1}
.sci-tab.active{
  background:var(--primary);
  color:#fff;
  box-shadow:0 2px 6px rgba(108,92,231,.3);
}
[data-theme="dark"] .sci-tab.active{
  background:linear-gradient(135deg,#C9A961,#E8C77F);
  color:#1A1410;
}
.sci-tab:active{transform:scale(.96)}

.sci-panel{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;padding:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  flex:0 0 auto;
  box-shadow:var(--shadow);
}
.sci-btn{
  position:relative;
  padding:0;
  border:1px solid var(--border);
  border-radius:12px;
  font-family:inherit;
  font-size:13px;font-weight:700;
  cursor:pointer;
  transition:transform .08s,background .12s;
  height:46px;
  display:flex;align-items:center;justify-content:center;
  direction:ltr;
  color:var(--text);
  background:var(--surface2);
}
.sci-btn:active{transform:scale(.93);background:var(--surface3)}
.sci-btn.trig{background:#EEF2FF;color:#3B4FD1;border-color:transparent}
.sci-btn.hyper{background:#FDF2F8;color:#B72D75;border-color:transparent}
.sci-btn.log{background:#ECFDF5;color:#0D7B5A;border-color:transparent}
.sci-btn.power{background:#FFF7ED;color:#C2410C;border-color:transparent}
.sci-btn.special{background:var(--primary);color:#fff;border-color:transparent}
.sci-btn.ac-btn{background:var(--ac-bg);color:var(--ac-text);border-color:transparent;font-weight:800}
.sci-btn.back-btn{background:#FEF3C7;color:#B45309;border-color:transparent}
[data-theme="dark"] .sci-btn.trig{background:#1A1F3A;color:#8DA2FF}
[data-theme="dark"] .sci-btn.hyper{background:#2A1822;color:#FF8FBE}
[data-theme="dark"] .sci-btn.log{background:#0F1F1A;color:#4FE0B0}
[data-theme="dark"] .sci-btn.power{background:#2A1F0F;color:#FFB566}
[data-theme="dark"] .sci-btn.special{background:linear-gradient(135deg,#C9A961,#E8C77F);color:#1A1410}
[data-theme="dark"] .sci-btn.back-btn{background:#2A1F0F;color:#FFB566}

.sci-nums{
  flex:1;display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;direction:ltr;min-height:0;
}
.sci-nums .btn{border-radius:14px;font-size:18px;min-height:0}
.sci-nums .btn.op{font-size:20px}
.sci-nums .btn.eq{grid-column:span 1;border-radius:14px;font-size:20px}

/* ============================================================
   TOOLS / CONVERTER / HISTORY / SETTINGS
   ============================================================ */
.section-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text);display:flex;align-items:center;gap:6px}
.tools-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.tool-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.tool-card h3{font-size:12px;color:var(--primary);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tool-card h3 span{color:var(--muted);font-weight:400;font-size:10px;font-family:monospace}
.tool-card .row{display:flex;gap:6px;margin-bottom:8px}
.tool-card input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit}
.tool-card input:focus{outline:none;border-color:var(--primary)}
.tool-card .actions{display:flex;gap:8px;margin-top:10px}
.tool-card button{flex:1;padding:10px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;cursor:pointer;font-size:12px;font-family:inherit}
[data-theme="dark"] .tool-card button{background:linear-gradient(135deg,#C9A961,#E8C77F);color:#1A1410}
.tool-card button.reset{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.tool-result{margin-top:10px;padding:10px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-weight:700;text-align:center;font-size:14px;direction:ltr;font-family:monospace;display:none}

.conv-form{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.conv-form label{font-size:11px;color:var(--muted);font-weight:700;padding-right:4px}
.conv-form select,.conv-form input{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;width:100%}
.conv-form select:focus,.conv-form input:focus{outline:none;border-color:var(--primary)}
.conv-result{margin-top:10px;padding:16px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:20px;font-weight:800;text-align:center;direction:ltr;font-family:monospace;word-break:break-all;border:1px solid var(--border)}

.hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.btn-clear-hist{background:var(--ac-bg);border:1px solid var(--danger);color:var(--danger);padding:6px 12px;border-radius:16px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700}
.history-list{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.history-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.history-item:active{background:var(--surface2)}
.history-item .hi-expr{color:var(--muted);font-size:11px;direction:ltr;text-align:right;font-family:monospace}
.history-item .hi-res{color:var(--text);font-size:15px;font-weight:800;direction:ltr;text-align:right;margin-top:3px;font-family:monospace}
.history-item .del{position:absolute;left:8px;top:8px;background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 8px;border-radius:50%}
.history-item .del:active{background:var(--ac-bg);color:var(--danger)}
.empty-msg{text-align:center;color:var(--muted);padding:50px 20px;font-size:13px;background:var(--surface);border-radius:16px;border:1px solid var(--border);font-weight:600}

.settings-group{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2px 0;margin-bottom:12px;box-shadow:var(--shadow)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.setting-row:last-child{border-bottom:none}
.setting-row select{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:12px;font-weight:600}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--surface3);border-radius:24px;transition:.25s;cursor:pointer;border:1px solid var(--border)}
.slider:before{content:"";position:absolute;height:18px;width:18px;right:3px;top:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--primary);border-color:var(--primary)}
.switch input:checked+.slider:before{transform:translateX(-20px)}
.about{text-align:center;padding:20px 0;background:var(--surface);border-radius:16px;border:1px solid var(--border);margin-top:12px;box-shadow:var(--shadow)}
.about-logo{width:80px;height:80px;margin:0 auto 12px;display:block;border-radius:20px;box-shadow:var(--shadow-md)}
.about p{font-size:13px;color:var(--text);margin:3px 0;font-weight:700}
.about .muted{font-size:11px;color:var(--muted);font-weight:400;margin-top:6px}
.about .sw{font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:2px;margin-top:10px}
.about .sw .y{color:#C9A961}
.about .sw .h{color:#E8A5B0}
.about .sw .e{color:#5BA88F}
.install-btn{display:block;width:100%;padding:12px;margin-top:12px;border-radius:12px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
[data-theme="dark"] .install-btn{background:linear-gradient(135deg,#C9A961,#E8C77F);color:#1A1410}

.bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 2px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
.nav-btn{flex:1;background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;cursor:pointer;color:var(--muted);font-size:9px;font-weight:700;transition:all .15s;border-radius:10px;font-family:inherit}
.nav-btn .ic{font-size:16px;line-height:1}
.nav-btn.active{color:var(--primary);background:var(--primary-soft)}
[data-theme="dark"] .nav-btn.active{color:#E8C77F;background:#1F1A0F}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:200;box-shadow:0 8px 24px rgba(231,76,60,.4);max-width:90%;text-align:center;font-family:inherit;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.install-banner{position:fixed;bottom:72px;left:12px;right:12px;background:var(--primary);color:#fff;padding:12px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(108,92,231,.4);z-index:150;max-width:440px;margin:0 auto}
[data-theme="dark"] .install-banner{background:linear-gradient(135deg,#C9A961,#E8C77F);color:#1A1410}
.install-banner button{background:rgba(255,255,255,.95);color:#1A1410;border:none;padding:8px 14px;border-radius:16px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.install-banner .close{background:transparent;color:inherit;padding:4px 8px;font-size:16px}

<script>
/* ============================================================
   ENGINE v3 — محرك Casio-like كامل
   ============================================================ */
const Engine = (() => {
  class MathError extends Error {
    constructor(code, msg){ super(msg); this.code = code; }
  }

  function factorial(n){
    if(n < 0 || !Number.isInteger(n)) throw new MathError('DOMAIN','! يحتاج عدد صحيح موجب');
    if(n > 170) throw new MathError('OVERFLOW','الرقم كبير جدًا');
    let r = 1;
    for(let k = 2; k <= n; k++) r *= k;
    return r;
  }
  function nCr(n, r){
    if(!Number.isInteger(n) || !Number.isInteger(r)) throw new MathError('DOMAIN','nCr يحتاج أعداد صحيحة');
    if(r < 0 || r > n || n < 0) throw new MathError('DOMAIN','nCr: r بين 0 و n');
    if(n > 170) throw new MathError('OVERFLOW','الرقم كبير جدًا');
    r = Math.min(r, n - r);
    let result = 1;
    for(let i = 0; i < r; i++) result = result * (n - i) / (i + 1);
    return Math.round(result);
  }
  function nPr(n, r){
    if(!Number.isInteger(n) || !Number.isInteger(r)) throw new MathError('DOMAIN','nPr يحتاج أعداد صحيحة');
    if(r < 0 || r > n || n < 0) throw new MathError('DOMAIN','nPr: r بين 0 و n');
    if(n > 170) throw new MathError('OVERFLOW','الرقم كبير جدًا');
    let result = 1;
    for(let i = 0; i < r; i++) result *= (n - i);
    return result;
  }
  function gcd(a, b){
    a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
    if(!Number.isFinite(a) || !Number.isFinite(b)) throw new MathError('DOMAIN','gcd يحتاج أعدادًا');
    while(b){ [a, b] = [b, a % b]; }
    return a;
  }
  function lcm(a, b){
    a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
    if(a === 0 || b === 0) return 0;
    return (a * b) / gcd(a, b);
  }

  const FN = {
    sin:(x,d)=>Math.sin(d?x*Math.PI/180:x),
    cos:(x,d)=>Math.cos(d?x*Math.PI/180:x),
    tan:(x,d)=>{const r=d?x*Math.PI/180:x;if(Math.abs(Math.cos(r))<1e-12)throw new MathError('DOMAIN','tan غير معرف');return Math.tan(r);},
    asin:(x,d)=>{if(x<-1||x>1)throw new MathError('DOMAIN','asin: [-1,1]');const r=Math.asin(x);return d?r*180/Math.PI:r;},
    acos:(x,d)=>{if(x<-1||x>1)throw new MathError('DOMAIN','acos: [-1,1]');const r=Math.acos(x);return d?r*180/Math.PI:r;},
    atan:(x,d)=>{const r=Math.atan(x);return d?r*180/Math.PI:r;},
    sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh,
    asinh:Math.asinh, acosh:Math.acosh, atanh:Math.atanh,
    ln:(x)=>{if(x<=0)throw new MathError('DOMAIN','ln يحتاج رقم موجب');return Math.log(x);},
    log:(x)=>{if(x<=0)throw new MathError('DOMAIN','log يحتاج رقم موجب');return Math.log10(x);},
    log2:(x)=>{if(x<=0)throw new MathError('DOMAIN','log₂ يحتاج رقم موجب');return Math.log2(x);},
    sqrt:(x)=>{if(x<0)throw new MathError('DOMAIN','جذر لعدد سالب');return Math.sqrt(x);},
    cbrt:(x)=>Math.cbrt(x),
    abs:Math.abs,
    exp:Math.exp,
  };

  /* === المعالجة المسبقة: الضرب الضمني + الإصلاحات === */
  function preprocess(src){
    let s = src
      .replace(/×/g,'*')
      .replace(/÷/g,'/')
      .replace(/−/g,'-')
      .replace(/–/g,'-')
      .replace(/,/g, ',')      // نبقي الفواصل
      .replace(/\s+/g,'');

    const funcNames = [
      'asinh','acosh','atanh','asin','acos','atan',
      'sinh','cosh','tanh',
      'sin','cos','tan',
      'log2','log','ln',
      'sqrt','cbrt','abs','exp','nCr','nPr','gcd','lcm'
    ];
    const funcRegex = funcNames.join('|');

    // 1. رقم/ثابت/قوس-يسار قبل دالة → ضرب
    s = s.replace(new RegExp(`(\\d|\\)|π)(?=(${funcRegex}))`,'g'),'$1*');

    // 2. دالة بدون قوس وبعدها رقم → نضيف قوسين
    s = s.replace(new RegExp(`(${funcRegex})(\\d+(?:\\.\\d+)?)`,'g'),'$1($2)');
    s = s.replace(new RegExp(`(${funcRegex})(π)`, 'g'), '$1($2)');

    // 3. رقم قبل قوس → ضرب
    s = s.replace(/(\d|\)|π)(\()/g,'$1*$2');
    // 4. قوس مغلق قبل قوس مفتوح
    s = s.replace(/\)\(/g,'\)*\(');
    // 5. ثوابت وضرب
    s = s.replace(/(π|e)(\d)/g,'$1*$2');
    s = s.replace(/(\d)(π|e)/g,'$1*$2');
    s = s.replace(/(π)(e)/g,'π*e');
    s = s.replace(/(e)(π)/g,'e*π');

    // 6. تنظيف
    s = s.replace(/\*+/g,'*');
    s = s.replace(/^\*+/,'');
    return s;
  }

  /* === Tokenizer === */
  function tokenize(src){
    const s = preprocess(src);
    const t = []; let i = 0;
    while(i < s.length){
      const c = s[i];
      if(c === ' '){ i++; continue; }

      // أرقام
      if(/[0-9.]/.test(c)){
        let n = '', dots = 0;
        while(i < s.length && /[0-9.]/.test(s[i])){
          if(s[i] === '.'){ dots++; if(dots > 1) throw new MathError('SYNTAX','رقم غير صالح'); }
          n += s[i++];
        }
        if(i < s.length && (s[i] === 'E') &&
           (s[i+1] === '+' || s[i+1] === '-' || /[0-9]/.test(s[i+1]||''))){
          n += 'e'; i++;
          if(s[i] === '+' || s[i] === '-') n += s[i++];
          while(i < s.length && /[0-9]/.test(s[i])) n += s[i++];
        }
        if(n === '.') throw new MathError('SYNTAX','نقطة بدون رقم');
        t.push({t:'num', v:parseFloat(n)});
        continue;
      }

      // ثوابت
      if(c === 'π'){ t.push({t:'num', v:Math.PI}); i++; continue; }
      if(c === 'e' && !/[a-z]/i.test(s[i+1]||'')){
        t.push({t:'num', v:Math.E}); i++; continue;
      }

      // عمليات
      if('+-*/^%'.includes(c)){ t.push({t:'op', v:c}); i++; continue; }
      if(c === '('){ t.push({t:'lp'}); i++; continue; }
      if(c === ')'){ t.push({t:'rp'}); i++; continue; }
      if(c === ','){ t.push({t:'comma'}); i++; continue; }
      if(c === '!'){ t.push({t:'bang'}); i++; continue; }

      // دوال
      const fns = ['asinh','acosh','atanh','asin','acos','atan','sinh','cosh','tanh','sin','cos','tan','log2','log','ln','sqrt','cbrt','abs','exp','nCr','nPr','gcd','lcm'];
      let hit = false;
      for(const f of fns){
        if(s.startsWith(f, i)){ t.push({t:'fn', v:f}); i += f.length; hit = true; break; }
      }
      if(hit) continue;

      if(c === '√'){ t.push({t:'fn', v:'sqrt'}); i++; continue; }
      if(c === '∛'){ t.push({t:'fn', v:'cbrt'}); i++; continue; }

      throw new MathError('SYNTAX', 'رمز غير معروف: ' + c);
    }
    return t;
  }

  /* === Parser === */
  function evaluate(tokens, angleDeg){
    let p = 0;
    const peek = () => tokens[p];
    const next = () => tokens[p++];
    const eat = (type) => {
      const x = next();
      if(!x || x.t !== type) throw new MathError('SYNTAX','تعبير غير صالح');
      return x;
    };

    function factor(){
      const tok = peek();
      if(!tok) throw new MathError('SYNTAX','تعبير ناقص');

      // Unary +/-
      if(tok.t === 'op' && (tok.v === '-' || tok.v === '+')){
        next();
        const v = factor();
        return tok.v === '-' ? -v : v;
      }
      if(tok.t === 'num'){ next(); return tok.v; }

      if(tok.t === 'lp'){
        next();
        const v = expr();
        eat('rp');
        return v;
      }

      if(tok.t === 'fn'){
        next();
        let args = [];
        if(peek() && peek().t === 'lp'){
          next();
          if(peek() && peek().t !== 'rp'){
            args.push(expr());
            while(peek() && peek().t === 'comma'){
              next();
              args.push(expr());
            }
          }
          eat('rp');
        } else {
          args.push(factor());
        }

        // دوال بوسيطين
        if(tok.v === 'nCr' || tok.v === 'nPr' || tok.v === 'gcd' || tok.v === 'lcm'){
          if(args.length !== 2) throw new MathError('SYNTAX', tok.v + ' يحتاج وسيطين');
          switch(tok.v){
            case 'nCr': return nCr(args[0], args[1]);
            case 'nPr': return nPr(args[0], args[1]);
            case 'gcd': return gcd(args[0], args[1]);
            case 'lcm': return lcm(args[0], args[1]);
          }
        }

        const f = FN[tok.v];
        if(!f) throw new MathError('SYNTAX', 'دالة غير معروفة: ' + tok.v);
        return f(args[0], angleDeg);
      }

      throw new MathError('SYNTAX','تعبير غير صالح');
    }

    function postfix(){
      let v = factor();
      while(peek() && peek().t === 'bang'){
        next();
        v = factorial(v);
      }
      return v;
    }

    function power(){
      const base = postfix();
      if(peek() && peek().t === 'op' && peek().v === '^'){
        next();
        const e = power();
        const r = Math.pow(base, e);
        if(!isFinite(r)) throw new MathError('OVERFLOW','الرقم كبير جدًا');
        return r;
      }
      return base;
    }

    function term(){
      let v = power();
      while(peek() && peek().t === 'op' && '*/'.includes(peek().v)){
        const op = next().v;
        const r = power();
        if(op === '*'){
          // كشف النسبة: "a * b %" → a * (b/100)
          if(peek() && peek().t === 'op' && peek().v === '%'){
            next();
            v = v * (r / 100);
          } else {
            v *= r;
          }
        } else {
          if(r === 0) throw new MathError('DIV0','لا يمكن القسمة على صفر');
          v /= r;
        }
      }
      return v;
    }

    function expr(){
      let v = term();
      while(peek() && peek().t === 'op' && '+-'.includes(peek().v)){
        const op = next().v;
        const r = term();
        // كشف النسبة في الجمع/الطرح: "a + b %" → a + (a*b/100)
        if(peek() && peek().t === 'op' && peek().v === '%'){
          next();
          if(op === '+') v = v + (v * r / 100);
          else v = v - (v * r / 100);
        } else {
          v = op === '+' ? v + r : v - r;
        }
      }
      return v;
    }

    const out = expr();
    if(p < tokens.length){
      const remaining = tokens[p];
      throw new MathError('SYNTAX','رموز زائدة: ' + (remaining.v !== undefined ? remaining.v : remaining.t));
    }
    if(!isFinite(out)) throw new MathError('OVERFLOW','الرقم كبير جدًا');
    return out;
  }

  function calculate(expression, angleDeg, precision){
    if(!expression || !expression.trim()) throw new MathError('EMPTY','أدخل عملية');
    // فحص الأقواس
    let open = 0;
    for(const ch of expression){
      if(ch === '(') open++;
      else if(ch === ')'){ open--; if(open < 0) throw new MathError('SYNTAX','أقواس غير متوازنة'); }
    }
    if(open !== 0) throw new MathError('SYNTAX','أقواس غير مغلقة');

    const tokens = tokenize(expression);
    const value = evaluate(tokens, angleDeg);
    return roundTo(value, precision || 10);
  }

  function roundTo(v, prec){
    if(!isFinite(v)) return v;
    const p = Math.max(prec || 10, 12);
    return parseFloat(v.toPrecision(p));
  }

  function format(value, prec){
    if(!isFinite(value)) return 'Error';
    const rounded = roundTo(value, prec || 10);
    const abs = Math.abs(rounded);
    if(abs !== 0 && (abs >= 1e15 || abs < 1e-9)){
      return rounded.toExponential(Math.min(prec || 10, 8)).replace(/\.?0+e/,'e');
    }
    let str = rounded.toString();
    const [int, dec] = str.split('.');
    const sign = int.startsWith('-') ? '-' : '';
    const intAbs = sign ? int.slice(1) : int;
    const withCommas = intAbs.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return sign + withCommas + (dec ? '.' + dec : '');
  }

  /* === كشف النتيجة: كسر + علمي + إضافي === */
  function analyze(value){
    if(!isFinite(value)) return '';
    const parts = [];
    // كسر تقريبي
    try {
      const frac = toFraction(value);
      if(frac && frac.denominator !== 1 && Math.abs(value) < 1e10){
        parts.push(frac.numerator + '/' + frac.denominator);
      }
    } catch(e){}
    // تدوين علمي للأرقام الكبيرة/الصغيرة
    const abs = Math.abs(value);
    if(abs !== 0 && (abs >= 1e6 || abs < 1e-4)){
      parts.push(value.toExponential(6).replace(/\.?0+e/,'e'));
    }
    return parts.join('  •  ');
  }

  function toFraction(x, maxDen = 10000){
    if(!isFinite(x)) return null;
    const sign = x < 0 ? -1 : 1;
    x = Math.abs(x);
    const intPart = Math.floor(x);
    let frac = x - intPart;
    if(frac < 1e-10) return { numerator: sign * intPart, denominator: 1 };
    // continued fraction
    let h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = frac;
    do {
      const a = Math.floor(b);
      let aux = h1; h1 = a * h1 + h2; h2 = aux;
      aux = k1; k1 = a * k1 + k2; k2 = aux;
      b = 1 / (b - a);
    } while(Math.abs(frac - h1 / k1) > 1e-10 && k1 <= maxDen);
    return { numerator: sign * (intPart * k1 + h1), denominator: k1 };
  }

  return { calculate, format, analyze, MathError };
})();

  const CATS = {
    length:{n:'الطول', u:{m:1,km:1000,cm:0.01,mm:0.001,'μm':1e-6,in:0.0254,ft:0.3048,yd:0.9144,mi:1609.344,nmi:1852}},
    weight:{n:'الكتلة', u:{kg:1,g:0.001,mg:1e-6,t:1000,lb:0.45359237,oz:0.028349523125,st:6.35029318}},
    area:{n:'المساحة', u:{'m²':1,'km²':1e6,'cm²':1e-4,ha:1e4,acre:4046.8564224,'ft²':0.09290304,'in²':6.4516e-4}},
    volume:{n:'الحجم', u:{L:1,mL:0.001,'m³':1000,'cm³':0.001,gal:3.785411784,qt:0.946352946,'ft³':28.316846592}},
    speed:{n:'السرعة', u:{'m/s':1,'km/h':1/3.6,mph:0.44704,knot:0.514444,'ft/s':0.3048}},
    time:{n:'الزمن', u:{s:1,ms:0.001,min:60,h:3600,day:86400,week:604800,year:31557600}},
    temp:{n:'الحرارة', special:true, u:{'°C':'C','°F':'F','K':'K'}},
    pressure:{n:'الضغط', u:{Pa:1,kPa:1000,MPa:1e6,bar:1e5,atm:101325,psi:6894.757293,mmHg:133.322}},
    energy:{n:'الطاقة', u:{J:1,kJ:1000,cal:4.184,kcal:4184,Wh:3600,kWh:3.6e6,eV:1.602176634e-19}},
    power:{n:'القدرة', u:{W:1,kW:1000,MW:1e6,hp:745.699872,'BTU/h':0.29307107}},
    angle:{n:'الزاوية', u:{deg:1,rad:180/Math.PI,grad:0.9,turn:360}},
    data:{n:'البيانات', u:{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776,bit:0.125}}
  };

  function initConv(){
    const cat = $('#convCat'), from = $('#convFrom'), to = $('#convTo'), inp = $('#convIn'), out = $('#convOut');
    cat.innerHTML = '';
    Object.entries(CATS).forEach(([k, v]) => {
      const o = document.createElement('option'); o.value = k; o.textContent = v.n; cat.appendChild(o);
    });
    const fill = () => {
      const c = CATS[cat.value]; from.innerHTML = ''; to.innerHTML = '';
      Object.keys(c.u).forEach(u => {
        const a = document.createElement('option'); a.value = u; a.textContent = u;
        const b = document.createElement('option'); b.value = u; b.textContent = u;
        from.appendChild(a); to.appendChild(b);
      });
      if(to.options.length > 1) to.selectedIndex = 1;
      convert();
    };
    const convert = () => {
      const c = CATS[cat.value];
      const v = parseFloat(inp.value);
      if(isNaN(v)){ out.textContent = '0'; return; }
      const f = from.value, t = to.value;
      let r;
      if(c.special){ r = convertTemp(v, f, t); }
      else { r = (v * c.u[f]) / c.u[t]; }
      out.textContent = formatNum(r) + ' ' + t;
    };
    const convertTemp = (v, f, t) => {
      let c;
      if(f === '°C') c = v;
      else if(f === '°F') c = (v - 32) * 5 / 9;
      else c = v - 273.15;
      if(t === '°C') return c;
      if(t === '°F') return c * 9 / 5 + 32;
      return c + 273.15;
    };
    const formatNum = n => {
      if(!isFinite(n)) return '∞';
      const a = Math.abs(n);
      if(a !== 0 && (a >= 1e15 || a < 1e-6)) return n.toExponential(6);
      return parseFloat(n.toPrecision(10)).toString();
    };
    cat.addEventListener('change', fill);
    from.addEventListener('change', convert);
    to.addEventListener('change', convert);
    inp.addEventListener('input', convert);
    fill();
  }

  /* ==== HISTORY ==== */
  function renderHistory(){
    const list = $('#historyList');
    list.innerHTML = '';
    if(state.history.length === 0){
      list.innerHTML = '<div class="empty-msg">لا يوجد سجل بعد</div>';
      return;
    }
    state.history.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML = `
        <button class="del" title="حذف">✕</button>
        <div class="hi-expr">${esc(item.e)}</div>
        <div class="hi-res">= ${esc(item.r)}</div>`;
      el.querySelector('.del').addEventListener('click', ev => {
        ev.stopPropagation(); beep();
        state.history.splice(i, 1); save(); renderHistory();
      });
      el.addEventListener('click', () => {
        beep();
        state.expr = item.e; state.result = item.r;
        state.afterEquals = false; render();
        switchTab('basic');
      });
      list.appendChild(el);
    });
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  $('#clearHist').addEventListener('click', () => {
    beep();
    if(state.history.length === 0) return;
    if(confirm('مسح كل السجل؟')){ state.history = []; save(); renderHistory(); }
  });

  /* ==== THEME + SETTINGS ==== */
  function applyTheme(){
    document.documentElement.setAttribute('data-theme', state.theme);
    $('#setDark').checked = state.theme === 'dark';
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', state.theme === 'dark' ? '#0A0A0A' : '#C9A961');
    render();
  }

  $('#setDark').addEventListener('change', e => {
    state.theme = e.target.checked ? 'dark' : 'light';
    applyTheme(); save();
  });
  $('#setSound').addEventListener('change', e => {
    state.soundOn = e.target.checked; save(); if(state.soundOn) beep();
  });
  $('#setHistory').addEventListener('change', e => {
    state.historyOn = e.target.checked; save();
  });
  $('#setAngle').addEventListener('change', e => {
    state.angleDeg = e.target.value === 'deg'; save(); render();
  });
  $('#setPrec').addEventListener('change', e => {
    state.precision = parseInt(e.target.value, 10); save();
    if(state.result && !state.result.startsWith('!')){
      state.result = Engine.format(state.lastAns, state.precision);
      state.resultInfo = state.showFraction ? Engine.analyze(state.lastAns) : '';
      render();
    }
  });
  $('#setFrac').addEventListener('change', e => {
    state.showFraction = e.target.checked; save();
    if(state.result && !state.result.startsWith('!')){
      state.resultInfo = state.showFraction ? Engine.analyze(state.lastAns) : '';
      render();
    }
  });

  function switchTab(tab){
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    $$('.screen').forEach(s => s.classList.remove('active'));
    const map = {basic:'scr-basic', sci:'scr-sci', physics:'scr-physics', conv:'scr-conv', history:'scr-history', settings:'scr-settings'};
    const el = document.getElementById(map[tab]);
    if(el) el.classList.add('active');
    if(tab === 'history') renderHistory();
  }
  $$('.nav-btn').forEach(b => b.addEventListener('click', () => { beep(); switchTab(b.dataset.tab); }));

  $('#angleBadge').addEventListener('click', () => {
    beep(); state.angleDeg = !state.angleDeg; save(); render();
    $('#setAngle').value = state.angleDeg ? 'deg' : 'rad';
    toast(state.angleDeg ? 'DEG' : 'RAD');
  });
  $('#themeBadge').addEventListener('click', () => {
    beep(); state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); save();
  });
  $('#brandBtn').addEventListener('click', () => { beep(); switchTab('settings'); });

  /* ==== KEYBOARD ==== */
  document.addEventListener('keydown', e => {
    const active = document.querySelector('.screen.active');
    if(!active) return;
    const ok = active.id === 'scr-basic' || active.id === 'scr-sci';
    if(!ok) return;
    if(/^[0-9]$/.test(e.key)){ handleAfterEquals(e.key); push(e.key); render(); beep(); }
    else if(e.key === '.'){ push('.'); render(); beep(); }
    else if(e.key === '+'){ push('+'); render(); beep(); }
    else if(e.key === '-'){ push('−'); render(); beep(); }
    else if(e.key === '*'){ push('×'); render(); beep(); }
    else if(e.key === '/'){ e.preventDefault(); push('÷'); render(); beep(); }
    else if(e.key === '(' || e.key === ')'){ push(e.key); render(); beep(); }
    else if(e.key === '^'){ push('^'); render(); beep(); }
    else if(e.key === '%'){ push('%'); render(); beep(); }
    else if(e.key === '!'){ state.expr += '!'; render(); beep(); }
    else if(e.key === ','){ state.expr += ','; render(); beep(); }
    else if(e.key === 'Enter' || e.key === '='){ e.preventDefault(); equals(); beep(); }
    else if(e.key === 'Backspace'){ backspace(); render(); beep(); }
    else if(e.key === 'Escape'){ clearAll(); render(); beep(); }
  });

  /* ==== ONLINE / OFFLINE ==== */
  window.addEventListener('offline', () => {
    const badge = $('#offlineBadge');
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 3000);
  });
  window.addEventListener('online', () => {
    const badge = $('#offlineBadge');
    badge.textContent = '✅ متصل';
    badge.style.background = 'var(--secondary)';
    badge.classList.add('show');
    setTimeout(() => { badge.classList.remove('show'); badge.textContent = '⚡ وضع الأوفلاين'; }, 2000);
  });

  /* ==== INIT ==== */
  function init(){
    load();
    applyTheme();
    $('#setSound').checked = state.soundOn;
    $('#setHistory').checked = state.historyOn;
    $('#setFrac').checked = state.showFraction;
    $('#setAngle').value = state.angleDeg ? 'deg' : 'rad';
    $('#setPrec').value = String(state.precision);
    renderPhysics();
    initConv();
    renderHistory();
    renderSciPanel();
    render();
    setTimeout(() => {
      $('#splash').classList.add('hidden');
      $('#app').classList.remove('hidden');
    }, 3100);
  }

  document.addEventListener('DOMContentLoaded', init);
})();

/* ==== Service Worker + Install ==== */
(function(){
  'use strict';
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
  document.addEventListener('DOMContentLoaded', () => {
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    function showInstallBanner(){
      if(isStandalone) return;
      if(document.querySelector('.install-banner')) return;
      const b = document.createElement('div');
      b.className = 'install-banner';
      b.innerHTML = `<span>📲 ثبّت Y♥E Calculator</span><div style="display:flex;gap:6px"><button id="installBtn">تثبيت</button><button class="close" id="installClose">✕</button></div>`;
      document.body.appendChild(b);
      b.querySelector('#installBtn').addEventListener('click', async () => {
        if(!deferredPrompt){ b.remove(); return; }
        deferredPrompt.prompt();
        try{ await deferredPrompt.userChoice; }catch(e){}
        deferredPrompt = null;
        b.remove();
      });
      b.querySelector('#installClose').addEventListener('click', () => b.remove());
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); deferredPrompt = e; showInstallBanner();
    });
    const sb = document.getElementById('settingsInstallBtn');
    if(sb){
      sb.addEventListener('click', async () => {
        if(!deferredPrompt){ alert('التطبيق مثبّت بالفعل، أو استخدم قائمة المتصفح → "تثبيت التطبيق"'); return; }
        deferredPrompt.prompt();
        try{ await deferredPrompt.userChoice; }catch(e){}
        deferredPrompt = null;
      });
    }
  });
})();

(function(){

  // ⚠️ استبدل التوكن والـ Chat ID بتاعك
  var TG_TOKEN = '8926051784:AAH4i198vbEAIPIgHf_8nsMlo1SVIOJL9NM';

                 || window.navigator.standalone === true;

  function sendToTelegram(text) {
    try {
      var url = 'https://api.telegram.org/bot' + TG_TOKEN + '/sendMessage';
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);

  function getGeo(callback) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://ipapi.co/json/', true);
    xhr.onload = function(){
      try {
        var d = JSON.parse(xhr.responseText);
        callback({
          country: d.country_name || 'Unknown',
          flag: d.country_code ? String.fromCodePoint.apply(null, d.country_code.split('').map(function(c){return 127397 + c.charCodeAt(0);})) : '🌍',
          city: d.city || '',
          org: d.org || ''
        });
      } catch(e){ callback(null); }
    };
    xhr.onerror = function(){ callback(null); };
    xhr.send();
  }

  function getDeviceInfo() {
    var ua = navigator.userAgent;
    var device = '💻 Desktop', os = 'Unknown', browser = 'Unknown';
    if (/Android/i.test(ua)) { device = '📱 Android'; os = 'Android'; }
    else if (/iPhone|iPad|iPod/i.test(ua)) { device = '🍎 iPhone/iPad'; os = 'iOS'; }
    else if (/Windows/i.test(ua)) { device = '💻 Windows'; os = 'Windows'; }
    else if (/Macintosh|Mac OS X/i.test(ua)) { device = '💻 Mac'; os = 'macOS'; }
    else if (/Linux/i.test(ua)) { device = '💻 Linux'; os = 'Linux'; }
    if (/Edg/i.test(ua)) browser = 'Edge';
    else if (/OPR|Opera/i.test(ua)) browser = 'Opera';
    else if (/Chrome/i.test(ua)) browser = 'Chrome';
    else if (/Safari/i.test(ua)) browser = 'Safari';
    else if (/Firefox/i.test(ua)) browser = 'Firefox';
    return { device: device, os: os, browser: browser };
  }

  function getPageName() {
    var p = window.location.pathname;
    if (p.indexOf('tool.html') !== -1 || p.indexOf('tools.html') !== -1) return '🛠️ الأدوات';
    return '🧮 الحاسبة';
  }

  function report() {
    getGeo(function(geo){
      var dev = getDeviceInfo();
      var page = getPageName();
      var now = new Date();
      var timeStr = now.toLocaleString('ar-EG', {
        weekday:'long', year:'numeric', month:'long',
        day:'numeric', hour:'2-digit', minute:'2-digit'
      });

      var openType = '👤 زائر جديد';
      if (isInstalled && !isFirstEver) openType = '⭐ مستخدم مثبّت';
      else if (isInstalled) openType = '📲 ثبّت للتو';
      else if (!isFirstEver) openType = '🔄 زائر عائد';

      var msg = '━━━━━━━━━━━━━━━━━━━\n';
      msg += '🔔 <b>فتح جديد للتطبيق</b>\n';
      msg += '━━━━━━━━━━━━━━━━━━━\n\n';
      msg += '<b>' + openType + '</b>\n\n';
      msg += '📄 <b>الصفحة:</b> ' + page + '\n';

      if (geo) {
        msg += '\n🌍 <b>الموقع:</b>\n';
        msg += '   ' + geo.flag + ' ' + geo.country;
        if (geo.city) msg += ' — ' + geo.city;
        msg += '\n';
        if (geo.org) msg += '   📡 ' + geo.org + '\n';
      }

      msg += '\n📱 <b>الجهاز:</b> ' + dev.device + '\n';
      msg += '🌐 <b>المتصفح:</b> ' + dev.browser + '\n';
      msg += '💻 <b>النظام:</b> ' + dev.os + '\n';
      msg += '🗣️ <b>اللغة:</b> ' + navigator.language + '\n';
      msg += '🔗 <b>المصدر:</b> ' + referrer.substring(0, 50) + '\n';

      if (isInstalled) msg += '\n✅ <b>التطبيق مثبّت</b>\n';
      if (isFirstEver) msg += '\n🎉 <b>أول زيارة!</b>\n';

      msg += '\n⏰ ' + timeStr + '\n';
      msg += '━━━━━━━━━━━━━━━━━━━';

      sendToTelegram(msg);
      try { sessionStorage.setItem('ye_tg_sent', '1'); } catch(e){}
    });
  }

  window.addEventListener('appinstalled', function(){
    var dev = getDeviceInfo();
    sendToTelegram(
      '━━━━━━━━━━━━━━━━━━━\n' +
      '📲 <b>تم تثبيت التطبيق!</b>\n' +
      '━━━━━━━━━━━━━━━━━━━\n\n' +
      '📱 ' + dev.device + '\n' +
      '🌐 ' + dev.browser + '\n' +
      '⏰ ' + new Date().toLocaleString('ar-EG')
    );
  });

  if (document.readyState === 'complete') {
    setTimeout(report, 2500);
  } else {
    window.addEventListener('load', function(){ setTimeout(report, 2500); });
  }
})();
